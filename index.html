<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zeiterfassung – PWA V24</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1f2937;background:#eef2f7}
*{box-sizing:border-box} body{margin:0;padding:18px;display:flex;justify-content:center}
.app{width:min(430px,100%);min-height:760px;background:#fff;border:1px solid #d7dde5;border-radius:24px;padding:24px;box-shadow:0 8px 28px #00000012}
h1{font-size:25px;margin:8px 0 10px;text-align:center} h2{font-size:19px;text-align:center;margin:10px 0 20px}
p{text-align:center;color:#667085}.stack{display:grid;gap:11px;margin-top:18px}
button{width:100%;border:1px solid #d0d5dd;background:#fff;border-radius:14px;padding:15px 14px;font-size:16px;text-align:left;cursor:pointer}
button:hover{background:#f8fafc}.primary{background:#2563eb;color:#fff;border-color:#2563eb;text-align:center;font-weight:700}
.danger{background:#fff5f5;color:#b42318;border-color:#f3b4b4;text-align:center;font-weight:700;margin-top:22px}
.timer{font-size:42px;font-weight:750;text-align:center;margin:25px 0;font-variant-numeric:tabular-nums}
.running{border:1px solid #d0d5dd;background:#f8fafc;border-radius:14px;padding:12px;margin-bottom:16px;font-weight:650}
input{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:12px;font-size:16px}
.row{border-bottom:1px solid #e5e7eb;padding:11px 2px;font-size:14px}.time{font-variant-numeric:tabular-nums;font-weight:650}
.note{font-size:13px;color:#667085;text-align:center;margin-top:10px}.back{text-align:center;color:#667085}
</style></head>
<body><main class="app" id="app"></main>
<script>
const app=document.getElementById('app');
let entries=[], active=null, tick=null, currentClient='F-Sch', pausedDrive=null, eventViaCarpool=false, currentEvent='', archive=[];
const now=()=>new Date();
const hhmm=d=>d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
const duration=ms=>{let s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`};
function clearTick(){if(tick)clearInterval(tick);tick=null}
function screen(title,body){persist();app.innerHTML=`<h1>${title}</h1>${body}${storageNotice()}`}
function btn(label,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${label}</button>`}
function startEntry(name,kind='normal'){active={name,start:now(),kind}; runningScreen()}
function go(next){
  const routes={
    'menu()':menu,
    'destinations()':destinations,
    'clientTime()':clientTime,
    'afterClient()':afterClient,
    'afterClientReturn()':afterClientReturn,
    'eventAtDestination()':eventAtDestination,
    'eventCarpoolPoint()':eventCarpoolPoint,
    'afterEvent()':afterEvent,
    'afterCarpoolReturn()':afterCarpoolReturn,
    'parking()':parking,
    'homeArrival()':homeArrival,
    'home()':home,
    'arrival()':arrival,
    'arrivalMeeting()':arrivalMeeting,
    'resumeDrive()':resumeDrive
  };
  if(routes[next]) routes[next]();
}
function endEntry(next){
  if(!active)return;
  entries.push({...active,end:now()});
  active=null;
  clearTick();
  persist();
  go(next);
}
function timerText(){return active?duration(now()-active.start):'00:00'}
function updateTimer(){let e=document.getElementById('timer');if(e)e.textContent=timerText()}
function runningScreen(){
 clearTick();
 screen(active.name,`<p>läuft seit <span class="time">${hhmm(active.start)}</span></p><div class="timer" id="timer">${timerText()}</div><div class="stack">${btn('END',`endEntry('${active.next||"menu()"}')`,'primary')}</div>`);
 tick=setInterval(updateTimer,250)
}
let pendingActivity=null;
function activity(name,next){
  clearTick();
  active=null;
  pendingActivity={name,next};
  screen(name,`<p>Bereit zum Starten</p><div class="stack">${btn('START','startPendingActivity()','primary')}</div>`);
}
function startPendingActivity(){
  if(!pendingActivity)return;
  active={name:pendingActivity.name,start:now(),kind:'normal',next:pendingActivity.next};
  pendingActivity=null;
  runningScreen();
}
function welcome(){clearTick();screen('Guten Morgen',`<p>${new Date().toLocaleDateString('de-DE')}</p><div class="stack">${btn('DIENST BEGINNEN','beginService()','primary')}${btn('📅 Arbeitstag manuell anlegen','manualDay()')}${btn('🏢 Büroansicht','officeMain()')}${btn('📂 Gesicherte Zeiten importieren','importData()')}</div>`)}
function beginService(){
 if(entries.length&&!entries.some(e=>e.name==='Protokoll gesendet')){
   alert('Es gibt einen begonnenen Arbeitstag. Bitte diesen zuerst fortsetzen und abschließen.');return;
 }
 if(entries.length){archive.push({date:entries[0]?.start||now(),entries:entries.map(e=>({...e}))});}
 entries=[];active=null;pausedDrive=null;
 entries.push({name:'Dienst begonnen',start:now(),end:now(),kind:'marker'});persist();menu();
}
function isoDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function escapeText(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function manualDay(){
 if(active){alert('Bitte zuerst die laufende Tätigkeit beenden.');return}
 screen('📅 Arbeitstag anlegen',`<p>Auch vergangene Tage können nachgetragen werden.</p><div class="stack"><label>Datum<input type="date" id="dayDate" value="${isoDate(new Date())}"></label><button class="primary" onclick="createManualDay()">ARBEITSTAG ANLEGEN</button>${btn('‹ Zurück','welcome()')}</div>`);
}
function createManualDay(){
 const val=document.getElementById('dayDate').value;
 if(!val)return alert('Bitte ein Datum wählen.');
 if(entries.length&&!entries.some(e=>e.name==='Protokoll gesendet'))return alert('Bitte den begonnenen Arbeitstag zuerst abschließen.');
 if(entries.length)archive.push({date:entries[0].start,entries:entries.map(e=>({...e}))});
 const d=new Date(val+'T08:00:00');entries=[{name:'Dienst begonnen',start:d,end:d,kind:'marker'}];active=null;persist();protocol();
}
const manualOptions=[
 '🚶 Fußweg Wohnung zum Auto','🚶 Fußweg zum Klienten','🚶 Fußweg zum Auto','🚶 Fußweg nach Hause',
 '🚗 Fahrt zum Klienten','🚗 Fahrt zum öffentlichen Parkplatz','🚗 Fahrt nach Hause',
 '🚗 Fahrt zum Teamtreffen','🚗 Fahrt zur Supervision','🚗 Fahrt zum Treffpunkt für Fahrgemeinschaft',
 '👤 Klientenzeit','📞 Telefonat','⛽ Tanken','📱 Kommunikation / Nachrichten','✉️ E-Mails',
 '📝 Dokumentation','📝 Tourenplanung','📝 Termin vorbereiten','📝 Termin nachbereiten',
 '📝 Fachliteratur','📝 Bericht verfassen','🎒 Tasche packen',
 '👥 Kollegialer Austausch / Fallbesprechung','👥 Teamtreffen','🧑‍🏫 Supervision',
 '☕ Pause','🚻 Toilettenpause','⏸ Private Unterbrechung','➕ Sonstige Tätigkeit'
];
function manualEntry(){
 const base=entries[0]?.start||new Date();
 screen('➕ Tätigkeit nachtragen',`<div class="stack">
 <label>Tätigkeit<select id="manualName" style="width:100%;padding:12px">${manualOptions.map(n=>`<option>${escapeText(n)}</option>`).join('')}</select></label>
 <label>Klient (optional)<select id="manualClient" style="width:100%;padding:12px"><option value="">Ohne Klient</option>${officeClientNames.map(n=>`<option>${escapeText(n)}</option>`).join('')}</select></label>
 <label>Datum<input id="manualDate" type="date" value="${isoDate(base)}"></label>
 <label>Beginn<input id="manualStart" type="time" value="08:00"></label>
 <label>Ende<input id="manualEnd" type="time" value="08:30"></label>
 <label>Notiz<input id="manualNote" placeholder="optional"></label>
 <button class="primary" onclick="saveManualEntry()">EINTRAG SPEICHERN</button>${btn('Abbrechen','protocol()')}</div>`);
}
function saveManualEntry(){
 const date=document.getElementById('manualDate').value, st=document.getElementById('manualStart').value,en=document.getElementById('manualEnd').value;
 if(!date||!st||!en)return alert('Datum und Uhrzeiten eingeben.');
 const start=new Date(`${date}T${st}:00`),end=new Date(`${date}T${en}:00`);
 if(end<=start)return alert('Die Endzeit muss nach dem Beginn liegen.');
 const name=document.getElementById('manualName').value,client=document.getElementById('manualClient').value;
 const note=document.getElementById('manualNote').value.trim();
 entries.push({name:client?`${name} ${client}`:name,start,end,kind:'normal',corrected:true,manual:true,correctionNote:note||'Manuell nachgetragen'});
 entries.sort((a,b)=>a.start-b.start);persist();protocol();
}
function menu(){clearTick();screen('Hauptmenü',`<div class="stack">
${btn('📱 Kommunikation / Nachrichten',`activity('📱 Kommunikation / Nachrichten','menu()')`)}
${btn('✉️ E-Mails',`activity('✉️ E-Mails','menu()')`)}
${btn('📝 Bürotätigkeit',`office('menu()')`)}
${btn('🎒 Tasche packen',`activity('🎒 Tasche packen','menu()')`)}
${btn('🚶 Zum Auto',`activity('🚶 Zum Auto','destinations()')`)}
${btn('👥 Kollegialer Austausch / Fallbesprechung',`activity('👥 Kollegialer Austausch / Fallbesprechung','menu()')`)}
${btn('➕ Sonstige Tätigkeit',`activity('➕ Sonstige Tätigkeit','menu()')`)}
${btn('☕ Pause',`activity('☕ Pause','menu()')`)}
${btn('🚻 Toilettenpause',`activity('🚻 Toilettenpause','menu()')`)}
${btn('⏸ Privat unterbrechen',`activity('⏸ Private Unterbrechung','menu()')`)}
</div>${btn('🔴 DIENST BEENDEN','protocol()','danger')}`)}
function destinations(){clearTick();screen('Wohin möchtest du fahren?',`<div class="stack">
${btn('👤 Zu einem Klienten','clients(false)')}
${btn('👥 Zu einem Teamtreffen',`eventTravelChoice('Teamtreffen')`)}
${btn('🧑‍🏫 Zur Supervision',`eventTravelChoice('Supervision')`)}
${btn('🤝 Zum Treffpunkt mit einem Klienten','clients(true)')}
${btn('🅿️ Öffentlichen Parkplatz anfahren',`drive('🚗 Fahrt zum öffentlichen Parkplatz','parking()')`)}
${btn('🏠 Nach Hause',`drive('🚗 Fahrt nach Hause','homeArrival()')`)}</div>`)}


function eventTravelChoice(type){
  currentEvent=type;
  eventViaCarpool=false;
  clearTick();
  const icon=type==='Teamtreffen'?'👥':'🧑‍🏫';
  screen(`${icon} ${type}`,`<h2>Wie möchtest du hinfahren?</h2><div class="stack">
    ${btn(`${icon} Direkt zum ${type}`,`startEventDirect()`)}
    ${btn('🚗 Fahrt zum Treffpunkt für Fahrgemeinschaft',`startEventCarpool()`)}
    ${btn('‹ Zurück','destinations()','back')}
  </div>`);
}
function startEventDirect(){
  eventViaCarpool=false;
  const prefix=currentEvent==='Teamtreffen'?'zum Teamtreffen':'zur Supervision';
  drive(`🚗 Fahrt ${prefix}`,'eventAtDestination()');
}
function startEventCarpool(){
  eventViaCarpool=true;
  drive('🚗 Fahrt zum Treffpunkt für Fahrgemeinschaft','eventCarpoolPoint()');
}
function eventCarpoolPoint(){
  clearTick();
  const prefix=currentEvent==='Teamtreffen'?'zum Teamtreffen':'zur Supervision';
  screen('Treffpunkt für Fahrgemeinschaft',`<h2>Weiter zur Veranstaltung</h2><div class="stack">
    ${btn(`🚗 Fahrt ${prefix}`,`driveToEventFromCarpool()`)}
  </div>`);
}
function driveToEventFromCarpool(){
  const prefix=currentEvent==='Teamtreffen'?'zum Teamtreffen':'zur Supervision';
  drive(`🚗 Fahrt ${prefix}`,'eventAtDestination()');
}
function eventAtDestination(){
  clearTick();
  const icon=currentEvent==='Teamtreffen'?'👥':'🧑‍🏫';
  activity(`${icon} ${currentEvent}`,'afterEvent()');
}
function afterEvent(){
  clearTick();
  const returnBtn=eventViaCarpool
    ? btn('🚗 Zurück zum Treffpunkt für Fahrgemeinschaft',`returnToCarpool()`)
    : '';
  screen(`${currentEvent} beendet`,`<h2>Was möchtest du jetzt machen?</h2><div class="stack">
    ${returnBtn}
    ${btn('👤 Zum nächsten Klienten','clients(false)')}
    ${btn('🤝 Zum Treffpunkt mit einem Klienten','clients(true)')}
    ${btn('🅿️ Öffentlichen Parkplatz anfahren',`drive('🚗 Fahrt zum öffentlichen Parkplatz','parking()')`)}
    ${btn('🏠 Nach Hause fahren',`drive('🚗 Fahrt nach Hause','homeArrival()')`)}
  </div>`);
}
function returnToCarpool(){
  drive('🚗 Fahrt zurück zum Treffpunkt für Fahrgemeinschaft','afterCarpoolReturn()');
}
function afterCarpoolReturn(){
  eventViaCarpool=false;
  clearTick();
  screen('Treffpunkt für Fahrgemeinschaft erreicht',`<h2>Wohin möchtest du fahren?</h2><div class="stack">
    ${btn('👤 Zu einem Klienten','clients(false)')}
    ${btn('👥 Zu einem Teamtreffen',`eventTravelChoice('Teamtreffen')`)}
    ${btn('🧑‍🏫 Zur Supervision',`eventTravelChoice('Supervision')`)}
    ${btn('🤝 Zum Treffpunkt mit einem Klienten','clients(true)')}
    ${btn('🅿️ Öffentlichen Parkplatz anfahren',`drive('🚗 Fahrt zum öffentlichen Parkplatz','parking()')`)}
    ${btn('🏠 Nach Hause','drive("🚗 Fahrt nach Hause","homeArrival()")')}
  </div>`);
}

function clients(meeting){screen('Klient auswählen',`<input id="q" placeholder="🔎 Suche" oninput="filterClients()"><div class="stack" id="clients">
${['A-Abe','F-Sch','M-Mül','S-Sch','T-Wag'].map(n=>`<button data-n="${n}" onclick="chooseClient('${n}',${meeting})">${n}</button>`).join('')}</div>${btn('‹ Zurück','destinations()','back')}`)}
function filterClients(){let q=document.getElementById('q').value.toLowerCase();document.querySelectorAll('#clients button').forEach(b=>b.style.display=b.dataset.n.toLowerCase().includes(q)?'block':'none')}
function chooseClient(n,meeting){currentClient=n;drive(meeting?`🚗 Fahrt zum Treffpunkt mit ${n}`:`🚗 Fahrt zu ${n}`,meeting?'arrivalMeeting()':'arrival()')}
let pendingDrive=null;
function drive(name,next){
  clearTick();
  active=null;
  pendingDrive={name,next};
  screen(name,`<p>Bereit zum Starten</p><div class="stack">${btn('FAHRT BEGINNEN','startPendingDrive()','primary')}</div>`);
}
function startPendingDrive(){
  if(!pendingDrive)return;
  active={name:pendingDrive.name,start:now(),kind:'drive',next:pendingDrive.next};
  pendingDrive=null;
  driveScreen();
}
function driveScreen(){
 clearTick();screen(active.name,`<p>läuft seit <span class="time">${hhmm(active.start)}</span></p><div class="timer" id="timer">${timerText()}</div><div class="stack">
${btn('📞 Telefonat',"parallel('📞 Telefonat')")}
${btn('⛽ Tanken',"parallel('⛽ Tanken')")}
${btn('⏸ Privat unterbrechen','privateBreak()')}
${btn('FAHRT BEENDEN',`endEntry('${active.next}')`,'primary')}</div>`);
 tick=setInterval(updateTimer,250)
}
let pendingParallel=null;
function parallel(name){
  const driveActive=active;
  clearTick();
  pendingParallel={name,drive:driveActive};
  screen(name,`<div class="running">${driveActive.name} läuft weiter</div><p>Bereit zum Starten</p><div class="stack">${btn('START','startPendingParallel()','primary')}${btn('‹ Zurück zur Fahrt','cancelParallel()','back')}</div>`);
}
function startPendingParallel(){
  if(!pendingParallel)return;
  const pStart=now();
  active=pendingParallel.drive;
  window._parallel={name:pendingParallel.name,start:pStart,drive:pendingParallel.drive};
  pendingParallel=null;
  screen(_parallel.name,`<div class="running">${active.name} läuft weiter</div><p>${_parallel.name} läuft seit <span class="time">${hhmm(pStart)}</span></p><div class="timer" id="timer">00:00</div><div class="stack">${btn('BEENDEN','endParallel()','primary')}</div>`);
  let t=document.getElementById('timer');
  persist();
  tick=setInterval(()=>{if(t)t.textContent=duration(now()-pStart)},250);
}
function cancelParallel(){
  if(pendingParallel) active=pendingParallel.drive;
  pendingParallel=null;
  driveScreen();
}
function endParallel(){entries.push({name:_parallel.name,start:_parallel.start,end:now(),kind:'parallel'});active=_parallel.drive;window._parallel=null;persist();driveScreen()}
function privateBreak(){
 const driveActive=active; clearTick();
 screen('⏸ Private Unterbrechung',`<div class="running">${driveActive.name} läuft noch</div><p>Private Unterbrechung starten?</p><div class="stack">${btn('START',`startPrivateBreak()`,'primary')}${btn('‹ Zurück zur Fahrt','driveScreen()','back')}</div>`);
 pausedDrive=driveActive;
}
function startPrivateBreak(){
 entries.push({name:pausedDrive.name,start:pausedDrive.start,end:now(),kind:'drive-part'});
 active={name:'⏸ Private Unterbrechung',start:now(),kind:'private',next:'resumeDrive()'};
 runningScreen();
}
function resumeDrive(){active={name:pausedDrive.name,start:now(),kind:'drive',next:pausedDrive.next};pausedDrive=null;driveScreen()}
function arrival(){clearTick();screen(`Fahrt zu ${currentClient} beendet`,`<h2>Was möchtest du jetzt machen?</h2><div class="stack">${btn(`🚶 Fußweg zu ${currentClient}`,`activity('🚶 Fußweg zu ${currentClient}','clientTime()')`)}${btn(`👤 Direkt zu ${currentClient}`,'clientTime()')}</div>`)}
function arrivalMeeting(){clearTick();screen(`Treffpunkt mit ${currentClient}`,`<h2>Was möchtest du jetzt machen?</h2><div class="stack">${btn(`🚶 Fußweg zum Treffpunkt mit ${currentClient}`,`activity('🚶 Fußweg zum Treffpunkt mit ${currentClient}','clientTime()')`)}${btn(`👤 Direkt zum Treffpunkt mit ${currentClient}`,'clientTime()')}</div>`)}
function clientTime(){activity(`👤 Klientenzeit ${currentClient}`,'afterClientReturn()')}
function afterClientReturn(){
  clearTick();
  screen('Klientenzeit beendet',`<h2>Wie geht es weiter?</h2><div class="stack">
  ${btn('🚶 Fußweg zum Auto',`activity('🚶 Fußweg zum Auto','afterClient()')`)}
  ${btn('🚗 Direkt im Auto','afterClient()')}
  </div>`);
}
function afterClient(){clearTick();screen('Klientenzeit beendet',`<h2>Was möchtest du jetzt machen?</h2><div class="stack">${btn('🚗 Nächsten Klienten anfahren','clients(false)')}${btn('🅿️ Öffentlichen Parkplatz anfahren',`drive('🚗 Fahrt zum öffentlichen Parkplatz','parking()')`)}${btn('🏠 Nach Hause fahren',`drive('🚗 Fahrt nach Hause','homeArrival()')`)}</div>`)}
function parking(){clearTick();screen('🅿️ Öffentlicher Parkplatz',`<h2>Was möchtest du jetzt machen?</h2><div class="stack">
${btn('📝 Bürotätigkeit',`office('parking()')`)}${btn('📱 Kommunikation / Nachrichten',`activity('📱 Kommunikation / Nachrichten','parking()')`)}
${btn('✉️ E-Mails',`activity('✉️ E-Mails','parking()')`)}${btn('📞 Telefonat',`activity('📞 Telefonat','parking()')`)}
${btn('☕ Pause',`activity('☕ Pause','parking()')`)}${btn('🚻 Toilettenpause',`activity('🚻 Toilettenpause','parking()')`)}
${btn('➕ Sonstige Tätigkeit',`activity('➕ Sonstige Tätigkeit','parking()')`)}${btn('🚗 WEITERFAHREN','destinations()','primary')}</div>`)}
function homeArrival(){clearTick();screen('Fahrt nach Hause beendet',`<h2>Was möchtest du jetzt machen?</h2><div class="stack">${btn('🚶 Fußweg nach Hause',`activity('🚶 Fußweg nach Hause','home()')`)}${btn('👤 Direkt nach Hause','home()')}</div>`)}
function home(){clearTick();screen('🏠 Zuhause',`<div class="stack">${btn('📝 Bürotätigkeit',`office('home()')`)}${btn('📱 Kommunikation / Nachrichten',`activity('📱 Kommunikation / Nachrichten','home()')`)}${btn('✉️ E-Mails',`activity('✉️ E-Mails','home()')`)}${btn('☕ Pause',`activity('☕ Pause','home()')`)}${btn('🚗 Zum Auto',`activity('🚶 Zum Auto','destinations()')`)}</div>${btn('🔴 ARBEITSTAG BEENDEN','protocol()','danger')}`)}
function office(ret){screen('📝 Bürotätigkeit',`<div class="stack">${['Dokumentation','Tourenplanung','Termin vorbereiten','Termin nachbereiten','Fachliteratur','Bericht verfassen','Sonstiges'].map(x=>`<button onclick="activity('📝 ${x}','${ret}')">${x}</button>`).join('')}</div>`)}
function inputTime(d){
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function editEntry(i){
  clearTick();
  const e=entries[i];
  if(!e || e.kind==='marker') return protocol();
  screen('✏️ Eintrag korrigieren',`
    <p><strong>${e.name}</strong></p>
    <div class="stack">
      <label>Datum<br><input id="editDate" type="date" value="${isoDate(e.start)}"></label>
      <label>Beginn<br><input id="editStart" type="time" value="${inputTime(e.start)}"></label>
      <label>Ende<br><input id="editEnd" type="time" value="${inputTime(e.end)}"></label>
      <label>Notiz zur Korrektur<br><input id="editNote" type="text" value="${e.correctionNote||''}" placeholder="optional"></label>
      <button class="primary" type="button" id="saveCorrectionBtn">ÄNDERUNG SPEICHERN</button>
      <button type="button" id="cancelCorrectionBtn">Abbrechen</button>
    </div>
    <p id="editError" class="note"></p>
  `);
  document.getElementById('saveCorrectionBtn').addEventListener('click',()=>saveCorrection(i));
  document.getElementById('cancelCorrectionBtn').addEventListener('click',protocol);
}
function timeOnSameDate(base,value){
  const parts=value.split(':').map(Number);
  const d=new Date(base);
  d.setHours(parts[0],parts[1],0,0);
  return d;
}
function saveCorrection(i){
  const e=entries[i];
  const s=document.getElementById('editStart').value;
  const en=document.getElementById('editEnd').value;
  const note=document.getElementById('editNote').value.trim();
  if(!s || !en){
    document.getElementById('editError').textContent='Bitte Beginn und Ende eintragen.';
    return;
  }
  const day=document.getElementById('editDate').value;
  if(!day)return alert('Bitte ein Datum eingeben.');
  const ns=new Date(`${day}T${s}:00`);
  let ne=new Date(`${day}T${en}:00`);
  if(ne<ns){
    document.getElementById('editError').textContent='Die Endzeit muss nach der Startzeit liegen.';
    return;
  }
  if(!e.original){
    e.original={start:new Date(e.start),end:new Date(e.end)};
  }
  e.start=ns;
  e.end=ne;

function intervalUnion(items){
 const ranges=items.filter(e=>e.start&&e.end&&e.end>e.start)
   .map(e=>[+e.start,+e.end]).sort((a,b)=>a[0]-b[0]);
 let total=0,left=null,right=null;
 for(const [start,end] of ranges){
   if(left===null){left=start;right=end;}
   else if(start<=right)right=Math.max(right,end);
   else{total+=right-left;left=start;right=end;}
 }
 return total+(left===null?0:right-left);
}
function minusIntervals(work,exclude){
 const events=[];
 work.forEach(e=>{if(e.start&&e.end&&e.end>e.start){events.push([+e.start,1,0],[+e.end,-1,0]);}});
 exclude.forEach(e=>{if(e.start&&e.end&&e.end>e.start){events.push([+e.start,1,1],[+e.end,-1,1]);}});
 events.sort((a,b)=>a[0]-b[0]);
 let w=0,x=0,prev=null,total=0;
 for(const [t,delta,type] of events){
   if(prev!==null&&t>prev&&w>0&&x===0)total+=t-prev;
   if(type===0)w+=delta;else x+=delta;
   prev=t;
 }

}

const STORAGE_KEY='zeiterfassung_pwa_v22';
const OLD_KEY='zeiterfassung_prototyp_v21';
let storageError=false;
let database=null;

let stateVersion=0;
function statePayload(){
 return {entries,active,pausedDrive,currentClient,eventViaCarpool,currentEvent,pendingActivity,pendingDrive,officeClientNames,archive,parallelRunning:window._parallel||null,updatedAt:Date.now()};
}
function openDatabase(){
 return new Promise((resolve,reject)=>{
  if(!('indexedDB' in window))return reject(new Error('IndexedDB nicht verfügbar'));
  const request=indexedDB.open('zeiterfassung_v22',1);
  request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains('state'))db.createObjectStore('state')};
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error);
 });
}
function readDatabase(db){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('state','readonly'),req=tx.objectStore('state').get('current');
  req.onsuccess=()=>resolve(req.result||null);
  req.onerror=()=>reject(req.error);
 });
}
function writeDatabase(db,data){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('state','readwrite');
  tx.objectStore('state').put(data,'current');
  tx.oncomplete=()=>resolve();
  tx.onerror=()=>reject(tx.error);
  tx.onabort=()=>reject(tx.error);
 });
}
function persist(){
 const data=statePayload();
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));storageError=false;}
 catch(e){storageError=true;}
 if(database){
   writeQueue=writeQueue.catch(()=>{}).then(()=>writeDatabase(database,data)).catch(e=>{
     storageError=true;console.error('Speicherfehler',e);
   });
 }
 return !storageError;
}
function storageNotice(){

function revive(e){return e?{...e,start:e.start?new Date(e.start):null,end:e.end?new Date(e.end):undefined,original:e.original?{start:new Date(e.original.start),end:new Date(e.original.end)}:undefined}:null}

  currentClient=d.currentClient||currentClient;eventViaCarpool=!!d.eventViaCarpool;currentEvent=d.currentEvent||'';
  pendingActivity=d.pendingActivity||null;pendingDrive=d.pendingDrive||null;
  if(Array.isArray(d.officeClientNames))officeClientNames=d.officeClientNames;
  if(Array.isArray(d.archive))archive=d.archive.map(day=>({...day,entries:day.entries.map(revive)}));

async function bootstrap(){

 if(entries.length)reopen();else welcome();
 persist();
 if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  navigator.serviceWorker.register('./service-worker.js').catch(e=>console.warn('Offline-Installation nicht verfügbar',e));
 }
}
function reopen(){
  if(window._parallel&&active){
    const p=window._parallel;
    active=p.drive;
    screen(p.name,`<div class="running">${active.name} läuft weiter</div><p>Parallelzeit seit ${hhmm(p.start)}</p><div class="timer" id="timer">${duration(now()-p.start)}</div><div class="stack">${btn('BEENDEN','endParallel()','primary')}</div>`);
    clearTick();tick=setInterval(()=>{const el=document.getElementById('timer');if(el)el.textContent=duration(now()-p.start)},250);
    return;
  }
  if(active){if(active.kind==='drive')return driveScreen();return runningScreen()}
  screen('Zeiterfassung – Wieder geöffnet',`<p>Gespeicherte Einträge: ${entries.filter(e=>e.kind!=='marker').length}</p><div class="stack">
    ${btn('🏢 Büroansicht','officeMain()','primary')}${btn('📅 Anderen Arbeitstag anlegen','manualDay()')}
    ${btn('📋 Tagesprotokoll','protocol()')}
    ${btn('DIENST FORTSETZEN','menu()')}${btn('📂 Sicherung importieren','importData()')}
  </div>`);
}
window.addEventListener('pagehide',persist);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')persist()});
bootstrap();
</script></body></html>
